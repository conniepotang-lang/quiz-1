<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择题练习</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{max-width:620px;margin:30px auto;padding:0 16px;background:#f7f9fc;}
.container{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 10px #00000015;}
.q-index{color:#666;margin-bottom:8px;}
.question{font-size:20px;margin-bottom:8px;line-height:1.6;}
.tag-multi{display:inline-block;background:#ff9500;color:#fff;font-size:14px;padding:2px 8px;border-radius:6px;margin-bottom:14px;}
.option{padding:14px 16px;border:1px solid #cbd5e1;border-radius:10px;margin:10px 0;cursor:pointer;font-size:17px;transition:0.2s;}
.option:hover{background:#eef6ff;}
.option.selected{background:#dbeafe;border-color:#3b82f6;}
.option.disabled{pointer-events:none;opacity:0.85;}
.option-right{background:#bbf7d0;border-color:#22c55e;}
.option-wrong{background:#fecaca;border-color:#ef4444;}

.result{margin-top:20px;font-size:19px;font-weight:bold;}
.correct-text{color:#009933;}
.wrong-text{color:#d62828;}
.answer-box{margin-top:10px;font-size:17px;color:#333;}
.btn-row{margin-top:24px;display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;}
#submitBtn{padding:12px 20px;font-size:17px;border:none;background:#f97316;color:#fff;border-radius:10px;cursor:pointer;}
#submitBtn:disabled{background:#fdba74;cursor:not-allowed;}
#nextBtn{padding:12px 24px;font-size:17px;border:none;background:#2563eb;color:#fff;border-radius:10px;cursor:pointer;}
#nextBtn:disabled{background:#94a3b8;cursor:not-allowed;}

#quizPage{}
#scorePage{display:none;text-align:center;}
#scorePage h2{margin-top:0;}
.score-item{font-size:18px;margin:12px 0;}
#restartBtn{margin-top:20px;padding:12px 28px;font-size:17px;background:#16a34a;color:white;border:none;border-radius:10px;cursor:pointer;}
</style>
</head>
<body>
<div class="container">
  <div id="quizPage">
    <div class="q-index" id="qIndex"></div>
    <div class="question" id="qText"></div>
    <div id="multiTag"></div>
    <div id="optWrap"></div>
    <div class="result" id="resText"></div>
    <div class="answer-box" id="ansBox"></div>
    <div class="btn-row">
      <button id="submitBtn" style="display:none;" disabled>提交答案</button>
      <button id="nextBtn" disabled>下一题</button>
    </div>
  </div>

  <div id="scorePage">
    <h2>📋 测验成绩单</h2>
    <div class="score-item" id="totalCount"></div>
    <div class="score-item" id="rightCount"></div>
    <div class="score-item" id="wrongCount"></div>
    <div class="score-item" id="scoreText"></div>
    <button id="restartBtn">重新开始</button>
  </div>
</div>

<script>
const qIndexEl = document.getElementById("qIndex");
const qEl = document.getElementById("qText");
const multiTagEl = document.getElementById("multiTag");
const optEl = document.getElementById("optWrap");
const resEl = document.getElementById("resText");
const ansEl = document.getElementById("ansBox");
const submitBtn = document.getElementById("submitBtn");
const nextBtn = document.getElementById("nextBtn");

const quizPage = document.getElementById("quizPage");
const scorePage = document.getElementById("scorePage");
const totalCountEl = document.getElementById("totalCount");
const rightCountEl = document.getElementById("rightCount");
const wrongCountEl = document.getElementById("wrongCount");
const scoreTextEl = document.getElementById("scoreText");
const restartBtn = document.getElementById("restartBtn");

const PICK_COUNT = 20;

// ============题库编辑区============
const questionBank = [
 {question:"單選：以弗所書作者是誰？",options:["彼得","保羅","提犘太","約翰"],correct:"保羅"},
 {question:"多選：哪些書卷不是監獄書信?",options:["以弗所書","雅各書","猶大書","加拉太書"],correct:["雅各書","猶大書","加拉太書"],isMultiple:true},
 {question:"單選：腓立比書寫作日期",options:["約主後50-52年","約主後56-58年","約主後60-62年","約主後70-72年"],correct:"約主後60-62年"},
 {question:"單選：一鑰語，在腓立比書四章中都出現過？",options:["復活","得勝","世俗中","在主裡"],correct:"在主裡"}

];
// =================================

let fullBank = [...questionBank];
let quizList = [];
let currentIdx = 0;
let answered = false;
let rightNum = 0;
let wrongNum = 0;
let selectedMulti = [];

function getRandomQuestions(bank, pickNum){
  if(!Array.isArray(bank) || bank.length === 0) return [];
  const copy = [...bank];
  for(let i=copy.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy.slice(0, pickNum);
}

function resetQuiz(){
  quizList = getRandomQuestions(fullBank, PICK_COUNT);
  if(quizList.length === 0){
    alert("题库为空，请检查 questionBank");
    return;
  }
  currentIdx = 0;
  rightNum = 0;
  wrongNum = 0;
  answered = false;
  quizPage.style.display="block";
  scorePage.style.display="none";
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  selectedMulti = [];
  resEl.textContent="";
  ansEl.textContent="";
  submitBtn.style.display="none";
  nextBtn.disabled=true;
  optEl.innerHTML="";
  multiTagEl.innerHTML="";

  const item = quizList[currentIdx];
  qIndexEl.textContent = `题目 ${currentIdx+1} / ${quizList.length}`;
  qEl.textContent = item.question;

  if(item.isMultiple){
    multiTagEl.innerHTML = `<span class="tag-multi">🔘 多选题（需全部选对）</span>`;
    submitBtn.style.display="inline-block";
    submitBtn.disabled=true;
  }

  item.options.forEach(opt=>{
    const div = document.createElement("div");
    div.className="option";
    div.textContent=opt;
    div.dataset.val = opt;
    if(item.isMultiple){
      div.onclick = ()=>toggleMulti(div,opt);
    }else{
      div.onclick = ()=>checkSingle(opt, div);
    }
    optEl.appendChild(div);
  })
}

function toggleMulti(dom, value){
  if(answered) return;
  const idx = selectedMulti.indexOf(value);
  if(idx > -1){
    selectedMulti.splice(idx,1);
    dom.classList.remove("selected");
  }else{
    selectedMulti.push(value);
    dom.classList.add("selected");
  }
  submitBtn.disabled = selectedMulti.length === 0;
}

function checkSingle(userSel, dom){
  if(answered) return;
  answered=true;
  const item = quizList[currentIdx];
  const allOpts = document.querySelectorAll(".option");
  allOpts.forEach(d=>d.classList.add("disabled"));

  if(userSel === item.correct){
    resEl.className="result correct-text";
    resEl.textContent="正確🎉";
    dom.classList.add("option-right");
    rightNum++;
  }else{
    resEl.className="result wrong-text";
    resEl.textContent="錯誤❌";
    ansEl.textContent=`正確答案：${item.correct}`;
    dom.classList.add("option-wrong");
    allOpts.forEach(d=>{
      if(d.textContent === item.correct){
        d.classList.add("option-right");
      }
    })
    wrongNum++;
  }
  nextBtn.disabled=false;
}

submitBtn.onclick = function(){
  if(answered) return;
  answered=true;
  const item = quizList[currentIdx];
  const allOpts = document.querySelectorAll(".option");
  allOpts.forEach(d=>d.classList.add("disabled"));

  const correctArr = item.correct;
  const user = [...selectedMulti];
  user.sort();
  const ans = [...correctArr].sort();
  const isOk = JSON.stringify(user) === JSON.stringify(ans);

  if(isOk){
    resEl.className="result correct-text";
    resEl.textContent="正確🎉（全部选对）";
    rightNum++;
  }else{
    resEl.className="result wrong-text";
    resEl.textContent="錯誤❌（需要全部选对）";
    ansEl.textContent=`正確答案：${correctArr.join("、")}`;
    wrongNum++;
  }

  allOpts.forEach(d=>{
    const v = d.dataset.val;
    if(correctArr.includes(v)){
      d.classList.add("option-right");
    }
    if(selectedMulti.includes(v) && !correctArr.includes(v)){
      d.classList.add("option-wrong");
    }
  })
  nextBtn.disabled=false;
}

nextBtn.onclick = ()=>{
  if(currentIdx < quizList.length-1){
    currentIdx++;
    renderQuestion();
  }else{
    showScore();
  }
}

function showScore(){
  quizPage.style.display="none";
  scorePage.style.display="block";
  const total = quizList.length;
  const score = Math.round((rightNum / total)*100);
  totalCountEl.textContent = `總题目：${total} 题`;
  rightCountEl.textContent = `✅答對：${rightNum} 题`;
  wrongCountEl.textContent = `❌答錯：${wrongNum} 题`;
  scoreTextEl.textContent = `得分：${score} / 100 分`;
}

restartBtn.onclick = resetQuiz;
resetQuiz();
</script>
</body>
</html>
